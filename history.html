<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forecast History · Iran Stability Monitor</title><link rel="stylesheet" href="assets/style.css"></head><body><header><div class="wrap"><h1>Forecast history</h1><nav><a href="index.html">← Dashboard</a></nav></div></header><main class="wrap"><p class="lead">Immutable dated forecast records. Earlier records may use legacy definitions; they are retained rather than reconstructed with hindsight.</p><div id="fullHistory"></div></main><footer><div class="wrap">Iran Stability Monitor</div></footer><script>const pct=x=>x==null?"—":x+"%";fetch("data/history.json").then(r=>r.json()).then(d=>d.updates.slice().reverse().forEach(a=>fullHistory.insertAdjacentHTML("beforeend",'<article class="archive"><h2>'+a.date+(a.forecasts?'':' <span class="legacy">legacy record</span>')+'</h2><p>'+a.summary+'</p><div>Regional escalation: '+pct(a.metrics.regional_escalation_90d)+' · Regime-ending transition: '+pct(a.metrics.regime_end_12m)+' · Legacy composite FX crisis: '+pct(a.metrics.fx_crisis_12m)+'</div></article>')));</script></body></html>
