name: Verify published Sunday assessment and announce
on:
  workflow_run:
    workflows: ['Validate and publish monitor']
    types: [completed]
permissions:
  contents: read
  actions: read
  pages: read
concurrency:
  group: iran-verified-x-announcement
  cancel-in-progress: false
jobs:
  verify-and-announce:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm gated commit and canonical publication (read-only)
        env:
          SOURCE_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify_publication.py
      - name: Mint short-lived GitHub App token for ONE deduplicated social attempt
        id: app-social
        if: hashFiles('.verified-publication.json') != '' && vars.AUTO_X_ENABLED == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.IRAN_GITHUB_APP_CLIENT_ID || 'Iv23liGgGQPahqYbv6in' }}
          private-key: ${{ secrets.IRAN_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-actions: read
          permission-pages: read
          permission-issues: read
      - name: Verify again, deduplicate, reserve, and schedule one X announcement
        if: hashFiles('.verified-publication.json') != '' && vars.AUTO_X_ENABLED == 'true'
        env:
          SOURCE_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ steps.app-social.outputs.token }}
          AUTO_X_ENABLED: ${{ vars.AUTO_X_ENABLED }}
          METRICOOL_API_TOKEN: ${{ secrets.METRICOOL_API_TOKEN }}
        run: python scripts/metricool_publish.py
      - name: Preserve publication and posting receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: .automation-audit/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
      - name: Failure summary
        if: failure()
        run: echo 'Publication verification or X scheduling stopped. The validated site is not rolled back. Preserve any x-announcement tag and reconcile Metricool before retrying.' >> "$GITHUB_STEP_SUMMARY"
