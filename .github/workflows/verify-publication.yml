name: Verify validated public assessment
on:
  workflow_run:
    workflows: ["Validate and publish monitor"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: iran-publication-verification
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Compare canonical public history with validated commit
        run: python scripts/verify_publication.py
