name: Verify published Sunday assessment and announce
on:
  workflow_run:
    workflows: ["Validate and publish monitor"]
    types: [completed]
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: iran-verified-x-announcement
  cancel-in-progress: false
jobs:
  verify-and-announce:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm gated CI, Pages job, newly appended Sunday record, and exact public JSON
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify_publication.py
      - name: Schedule one auto-published X announcement only for newly verified assessment
        if: ${{ hashFiles('.verified-assessment-date') != '' && vars.AUTO_X_ENABLED == 'true' }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          AUTO_X_ENABLED: ${{ vars.AUTO_X_ENABLED }}
          METRICOOL_API_TOKEN: ${{ secrets.METRICOOL_API_TOKEN }}
        run: python scripts/metricool_publish.py
