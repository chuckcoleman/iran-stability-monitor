name: Iran diagnostics and nonpublishing source rehearsal
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Read-only checks, paid API probe, or never-publish live-source dual-review test'
        required: true
        default: healthcheck
        type: choice
        options:
          - healthcheck
          - check-services
          - api-probe
          - research-dry-run
      resume_run_id:
        description: 'Optional previous STAGED diagnostic run ID; reuse completed stages and GET-resume acknowledged requests'
        required: false
        default: ''
        type: string
      allow_new_review_after_unknown:
        description: 'Opt in to a NEW potentially billable source-review POST if prior acknowledgement was lost'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
  pages: read
  id-token: write
concurrency:
  group: iran-diagnostics-single-run
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      IRAN_FORECAST_MODEL: ${{ vars.IRAN_FORECAST_MODEL }}
      OPENAI_WIF_AUDIENCE: https://api.openai.com/v1
      OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID || 'idp_e9927fe00cb77ede0705b70c' }}
      OPENAI_SERVICE_ACCOUNT_ID: user-1e07e217b5a13cf3bc804060
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema dependency
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'
      - name: Offline readiness tests
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
          node --check assets/app.js
      - name: Discard synthetic offline-test audit files
        run: rm -rf -- .automation-audit
      - name: Validate optional resume source
        if: inputs.resume_run_id != ''
        env:
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          import os, re
          assert os.environ['REQUESTED_MODE'] == 'research-dry-run', 'Resume is research-only'
          assert re.fullmatch(r'[1-9][0-9]*', os.environ['RESUME_RUN_ID']), 'Invalid diagnostic run ID'
          PY
      - name: Validate paid review retry consent
        if: inputs.allow_new_review_after_unknown
        env:
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          test "$REQUESTED_MODE" = 'research-dry-run' && test -n "$RESUME_RUN_ID" || {
            echo 'New-review permission requires a specific staged resume run ID.' >&2
            exit 1
          }
      - name: Restore previous response audit for GET-only resume
        if: inputs.mode == 'research-dry-run' && inputs.resume_run_id != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.resume_run_id }}
          pattern: integration-diagnostics-${{ inputs.resume_run_id }}-*
          merge-multiple: true
          github-token: ${{ github.token }}
          path: .automation-audit
      - name: Require a prior staged snapshot before continuing
        if: inputs.mode == 'research-dry-run' && inputs.resume_run_id != ''
        run: |
          test -s .automation-audit/research-snapshot.json || {
            echo 'No staged research snapshot in earlier artifact. Legacy monolithic runs cannot be reused; refusing new billable POST.' >&2
            exit 1
          }
      - name: Mint short-lived diagnostic GitHub App token
        id: app-preflight
        if: inputs.mode == 'healthcheck' || inputs.mode == 'check-services'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.IRAN_GITHUB_APP_CLIENT_ID || 'Iv23liGgGQPahqYbv6in' }}
          private-key: ${{ secrets.IRAN_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
          permission-actions: read
          permission-pages: read
          permission-issues: read
      - name: Check GitHub, WIF, branch protection, and Metricool without writes
        if: inputs.mode == 'healthcheck' || inputs.mode == 'check-services'
        env:
          GH_TOKEN: ${{ steps.app-preflight.outputs.token }}
          METRICOOL_API_TOKEN: ${{ secrets.METRICOOL_API_TOKEN }}
        run: python scripts/sunday_automation.py healthcheck
      - name: Check OpenAI web-search and JSON-mode contracts (paid, unpublishable)
        if: inputs.mode == 'api-probe'
        run: python scripts/sunday_automation.py api-probe
      - name: Run actual research and both source-only reviews (paid, NEVER PUBLISHABLE)
        if: inputs.mode == 'research-dry-run'
        env:
          IRAN_STAGED_RESUME: ${{ inputs.resume_run_id != '' && '1' || '' }}
          IRAN_ALLOW_NEW_REVIEW_AFTER_UNKNOWN: ${{ inputs.allow_new_review_after_unknown && '1' || '' }}
        # Keep a buffer before the hard job deadline so always() can upload
        # completed source-category checkpoints and redacted response IDs.
        run: timeout --signal=TERM --kill-after=30s 38m python scripts/read_only_research_dry_run.py
      - name: Preserve diagnostic audit (no credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .automation-audit/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Failure summary
        if: failure()
        run: echo 'Diagnostic failed. It does not authorize assessment preparation or publication.' >> "$GITHUB_STEP_SUMMARY"
