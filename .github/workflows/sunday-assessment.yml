name: Prepare Sunday Iran assessment
on:
  schedule:
    - cron: '0 13 * * 0'
    - cron: '0 14 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Read-only checks, unpublishable paid dry-run, or enabled Sunday publication'
        required: true
        default: healthcheck
        type: choice
        options:
          - healthcheck
          - check-services
          - dry-run
          - run
permissions:
  contents: read
  actions: read
  pages: read
  id-token: write
concurrency:
  group: iran-sunday-single-run
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || vars.ASSESSMENT_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
      ASSESSMENT_AUTOMATION_ENABLED: ${{ vars.ASSESSMENT_AUTOMATION_ENABLED }}
      IRAN_FORECAST_MODEL: ${{ vars.IRAN_FORECAST_MODEL }}
      OPENAI_WIF_AUDIENCE: https://api.openai.com/v1
      OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID || 'idp_e9927fe00cb77ede0705b70c' }}
      OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID || 'user-1e07e217b5a1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema dependency
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'
      - name: Offline readiness tests
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
          node --check assets/app.js
      - name: Determine whether a new Sunday candidate is permitted
        id: eligibility
        if: github.event_name == 'schedule' || inputs.mode == 'run'
        run: python scripts/sunday_automation.py eligible
      - name: Mint short-lived GitHub App preflight token
        id: app-preflight
        if: steps.eligibility.outputs.eligible == 'true' || inputs.mode == 'healthcheck' || inputs.mode == 'check-services'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.IRAN_GITHUB_APP_CLIENT_ID || 'Iv23liGgGQPahqYbv6in' }}
          private-key: ${{ secrets.IRAN_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
          permission-pages: read
          permission-issues: read
      - name: Check GitHub App, WIF, branch protection, and Metricool without writes
        if: inputs.mode == 'healthcheck' || inputs.mode == 'check-services'
        env:
          GH_TOKEN: ${{ steps.app-preflight.outputs.token }}
          METRICOOL_API_TOKEN: ${{ secrets.METRICOOL_API_TOKEN }}
        run: python scripts/sunday_automation.py healthcheck
      - name: Complete a live but unpublishable paid assessment dry-run
        if: inputs.mode == 'dry-run'
        run: python scripts/sunday_automation.py dry-run
      - name: Verify publication gates before paying for Sunday research
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ steps.app-preflight.outputs.token }}
        run: python scripts/sunday_automation.py preflight
      - name: Gather evidence and prepare candidate locally (no GitHub writes)
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ steps.app-preflight.outputs.token }}
        run: python scripts/sunday_automation.py prepare
      - name: Mint FRESH GitHub App token immediately before candidate publication
        id: app-publish
        if: steps.eligibility.outputs.eligible == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.IRAN_GITHUB_APP_CLIENT_ID || 'Iv23liGgGQPahqYbv6in' }}
          private-key: ${{ secrets.IRAN_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
          permission-pages: read
          permission-issues: read
      - name: Push candidate, require PR validation, and merge without bypass
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ steps.app-publish.outputs.token }}
        run: python scripts/sunday_automation.py publish
      - name: Preserve issuance, evidence, and result audit (no keys)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunday-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: .automation-audit/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Failure summary
        if: failure()
        run: echo 'Automation stopped at a failed guard. Inspect this run; do not bypass validation or blindly retry a social POST.' >> "$GITHUB_STEP_SUMMARY"
