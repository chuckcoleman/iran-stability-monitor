name: Prepare Sunday Iran assessment
on:
  schedule:
    # 09:00 New York in daylight time and standard time. Script discards wrong slot.
    - cron: '0 13 * * 0'
    - cron: '0 14 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iran-sunday-single-run
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_GH_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema dependency
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'
      - name: Check script syntax
        run: python -m compileall -q scripts
      - name: Run audited Sunday pipeline (disabled unless explicitly activated)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          ASSESSMENT_AUTOMATION_ENABLED: ${{ vars.ASSESSMENT_AUTOMATION_ENABLED }}
          IRAN_FORECAST_MODEL: ${{ vars.IRAN_FORECAST_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AUTOMATION_GH_TOKEN: ${{ secrets.AUTOMATION_GH_TOKEN }}
          GH_TOKEN: ${{ secrets.AUTOMATION_GH_TOKEN }}
          METRICOOL_API_TOKEN: ${{ secrets.METRICOOL_API_TOKEN }}
        run: python scripts/sunday_automation.py run
