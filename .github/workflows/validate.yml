name: Validate and publish monitor
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'
      - name: Validate JSON Schema
        run: python -m jsonschema -i data/history.json schema/history.schema.json
      - name: Compile all Python automation modules
        run: python -m compileall -q scripts tests
      - name: Validate JavaScript syntax
        run: node --check assets/app.js
      - name: Run validator regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate history and Protocol v1 conformance
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/validate_history.py
      - name: Require complete prospective review receipt before new assessment publication
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/review_receipt.py --baseline-ref "$GITHUB_EVENT_BEFORE"
      - name: Retain reproducible review source snapshot
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: automation-review-source
          retention-days: 7
          include-hidden-files: true
          path: |
            scripts/*.py
            tests/*.py
            schema/*.json
            data/history.json
            data/review-receipts/*.json
            data/review-drafts/*.json
            data/review-reports/*.md
            data/source-dossiers/*.json
            CHATGPT_HANDOFF.md
            REVIEW_POLICY.md
            REPORT_TEST_PROTOCOL.md
            SOURCE_WATCHLIST.md
            assets/app.js
            *.html
            README.md
            AUTOMATION.md
            CNAME
            .gitignore
            .github/workflows/*.yml

  deploy:
    name: Deploy validated website
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: iran-monitor-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stage only public website files
        run: |
          mkdir -p _site/assets _site/data
          cp index.html about.html history.html special-reports.html protocol-v1.html CNAME _site/
          cp assets/app.js assets/style.css _site/assets/
          cp data/history.json _site/data/
          # upload-pages-artifact@v4 excludes all dotfiles, including .nojekyll.
          # Actions-based Pages deployments serve the prebuilt static artifact;
          # do not stage hidden markers that will be silently omitted from it.
          test ! -e _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload validated Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 90
      - name: Download exact uploaded Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-downloaded
      - name: Verify uploaded Pages archive against exact Git files
        run: |
          python scripts/verify_pages_artifact.py \
            --site _site \
            --checkout . \
            --downloaded-tar "${RUNNER_TEMP}/pages-downloaded/artifact.tar" \
            --commit-sha "$GITHUB_SHA" \
            --output "${RUNNER_TEMP}/pages-artifact-attestation.json"
      - name: Retain verified Pages byte manifest
        uses: actions/upload-artifact@v4
        with:
          name: pages-attestation-${{ github.sha }}
          path: ${{ runner.temp }}/pages-artifact-attestation.json
          retention-days: 90
          if-no-files-found: error
      - name: Deploy artifact after validation
        id: deployment
        uses: actions/deploy-pages@v4
